<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="shieldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="50%" stop-color="#0f172a"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
    <linearGradient id="neonGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="50%" stop-color="#22d3ee"/>
      <stop offset="100%" stop-color="#10b981"/>
    </linearGradient>
    <linearGradient id="innerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#0ea5e9"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Outer Rounded Base -->
  <rect x="32" y="32" width="448" height="448" rx="100" fill="#090d16" stroke="#1e293b" stroke-width="8"/>

  <!-- Shield Base with Glow -->
  <path d="M 256,76 L 396,132 C 396,280 336,376 256,436 C 176,376 116,280 116,132 Z" 
        fill="url(#shieldGrad)" 
        stroke="url(#neonGrad)" 
        stroke-width="14"
        stroke-linejoin="round"
        filter="url(#glow)"/>

  <!-- Inner Cyber Nodes -->
  <path d="M 256,128 L 356,168 C 356,276 308,348 256,396 C 204,348 156,276 156,168 Z" 
        fill="#041325" 
        stroke="#0284c7" 
        stroke-width="4" 
        opacity="0.9"/>

  <!-- Center Key / Lock / VPN Wave -->
  <!-- Center Core -->
  <circle cx="256" cy="226" r="38" fill="url(#neonGrad)"/>
  <path d="M 238,248 L 274,248 L 282,316 L 230,316 Z" fill="url(#neonGrad)"/>
  
  <!-- Lock Core hole -->
  <circle cx="256" cy="226" r="14" fill="#041325"/>

  <!-- Dynamic Network Arc -->
  <path d="M 196,196 A 72,72 0 0,1 316,196" fill="none" stroke="#38bdf8" stroke-width="8" stroke-linecap="round"/>
  <path d="M 174,174 A 104,104 0 0,1 338,174" fill="none" stroke="#22d3ee" stroke-width="6" stroke-linecap="round" stroke-dasharray="8 8"/>
</svg>
